# .github/workflows/ci.yml
name: Django CI # Workflow name

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Environment variables available to all jobs
env:
  PYTHON_VERSION: '3.12' # Django 6 requires Python 3.12 or later
  POSTGRES_DB: 'github_actions'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres'
  POSTGRES_PORT: 5432
  POSTGRES_HOST: localhost

# A workflow run is made up of one or more jobs
jobs:
  # This workflow contains a single job called "build-and-test"
  build-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Service containers to run alongside the runner job
    services:
      postgres:
        image: postgres:15 # Use a specific version of PostgreSQL
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Checks out your repository under $GITHUB_WORKSPACE
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip' # Caches pip packages to speed up future runs

      # Step 3: Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Django's system checks
      - name: Run Django system checks
        run: python manage.py check

      # Step 5: Run Django tests with coverage
      - name: Run tests
        run: |
          pip install coverage
          coverage run manage.py test
          coverage report --fail-under=80 # Fails if coverage is below 80%

      # (Optional) Step 6: Run linting to enforce code style
      - name: Run linter
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics