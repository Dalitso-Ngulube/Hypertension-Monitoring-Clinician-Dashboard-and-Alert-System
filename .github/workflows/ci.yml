# .github/workflows/ci.yml
name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Environment variables available to all jobs
env:
  PYTHON_VERSION: '3.12'                            # Django 6 requires Python 3.12 or later
  SECRET_KEY: 'ci-only-not-a-production-secret-key' # Required by Django; NOT a production secret
  DEBUG: 'True'
  POSTGRES_DB: 'github_actions'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres'
  POSTGRES_PORT: 5432
  POSTGRES_HOST: localhost
  DB_NAME: 'github_actions'
  DB_USER: 'postgres'
  DB_PASSWORD: 'postgres'
  DB_PORT: 5432
  DB_HOST: localhost

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: github_actions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        env:
          SECRET_KEY: 'ci-only-not-a-production-secret-key'
          DEBUG: 'True'
          DB_NAME: ${{ env.POSTGRES_DB }}
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DB_HOST: ${{ env.POSTGRES_HOST }}
          DB_PORT: ${{ env.POSTGRES_PORT }}
        run: python manage.py check

      - name: Run tests
        env:
          SECRET_KEY: 'ci-only-not-a-production-secret-key'
          DEBUG: 'True'
          DB_NAME: ${{ env.POSTGRES_DB }}
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DB_HOST: ${{ env.POSTGRES_HOST }}
          DB_PORT: ${{ env.POSTGRES_PORT }}
        run: |
          pip install coverage
          coverage run --source=accounts,alerts,analytics,appointments,bp_readings,core,hypertension_monitoring_and_alert_system,notifications,patients,reports -m pytest
          coverage report --fail-under=80

      - name: Run linter
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,node_modules,htmlcov,.git,*/migrations/*