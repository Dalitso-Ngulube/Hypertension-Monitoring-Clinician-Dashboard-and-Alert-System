<!DOCTYPE html>
<html>
<head>
    <title>Hypertension Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card-critical { border-left: 4px solid #dc3545; }
        .stat-number { font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Hypertension Monitoring</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-light">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Summary Cards -->
        <div class="row mb-4" id="summary-cards">
            <div class="col-md-4">Loading summary...</div>
        </div>

        <!-- Risk Distribution & Patient Selector -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Risk Distribution</div>
                    <div class="card-body">
                        <canvas id="riskChart" width="400" height="300"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Patient Trend</div>
                    <div class="card-body">
                        <select id="patientSelect" class="form-select mb-3">
                            <option value="">-- Select a patient --</option>
                        </select>
                        <canvas id="trendChart" width="400" height="300"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Helper to fetch JSON with credentials (session cookie)
        async function fetchJSON(url) {
            const res = await fetch(url, { credentials: 'same-origin' });
            return res.json();
        }

        // Load summary cards
        async function loadSummary() {
            const data = await fetchJSON('/api/analytics/summary/');
            document.getElementById('summary-cards').innerHTML = `
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Total Patients</h5>
                            <p class="stat-number">${data.total_patients}</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Total Readings</h5>
                            <p class="stat-number">${data.total_readings}</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card card-critical">
                        <div class="card-body">
                            <h5 class="card-title">Critical Readings</h5>
                            <p class="stat-number text-danger">${data.critical_readings}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        let riskChart = null;
        async function loadRiskDistribution() {
            const data = await fetchJSON('/api/analytics/risk-distribution/');
            const labels = Object.keys(data);
            const values = Object.values(data);
            const ctx = document.getElementById('riskChart').getContext('2d');
            if (riskChart) riskChart.destroy();
            riskChart = new Chart(ctx, {
                type: 'pie',
                data: { labels, datasets: [{ data: values, backgroundColor: ['#ffc107', '#fd7e14', '#dc3545'] }] }
            });
        }

        // Load patient dropdown (from patient list API – if not exist, we need to create one)
        // For now, assume you have an endpoint `/api/patients/` (if not, we'll add it later)
        async function loadPatientList() {
            try {
                const patients = await fetchJSON('/api/patients/');
                const select = document.getElementById('patientSelect');
                select.innerHTML = '<option value="">-- Select a patient --</option>' +
                    patients.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            } catch(e) {
                console.warn("Patient list endpoint missing. You can add /api/patients/ later.");
            }
        }

        let trendChart = null;
        async function loadPatientTrend(patientId) {
            if (!patientId) return;
            const data = await fetchJSON(`/api/analytics/patient-trend/${patientId}/`);
            const labels = data.map(d => new Date(d.date).toLocaleDateString());
            const systolic = data.map(d => d.systolic);
            const diastolic = data.map(d => d.diastolic);
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChart) trendChart.destroy();
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Systolic', data: systolic, borderColor: 'red', tension: 0.1 },
                        { label: 'Diastolic', data: diastolic, borderColor: 'blue', tension: 0.1 }
                    ]
                }
            });
        }

        document.getElementById('patientSelect').addEventListener('change', (e) => {
            loadPatientTrend(e.target.value);
        });

        // Initialise dashboard
        loadSummary();
        loadRiskDistribution();
        loadPatientList();
    </script>
</body>
</html>
